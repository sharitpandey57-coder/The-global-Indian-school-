<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Global Indian School</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f5f5f7;
            padding-bottom: 30px;
        }
        .top-bar {
            background: linear-gradient(90deg, #ff1a1a, #cc0000);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .admin-btn-top {
            background: #fff;
            color: #cc0000;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .banner-container {
            padding: 15px;
        }
        .banner-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 3px solid #ffcc00;
            text-align: center;
        }
        .banner-card img {
            width: 100%;
            display: block;
        }
        .notice-board {
            margin: 0 15px 15px 15px;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 12px;
            border-radius: 10px;
            color: #856404;
        }
        .notice-board h4 {
            margin-bottom: 5px;
            font-size: 14px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 15px;
        }
        .card {
            background: white;
            border-radius: 13px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.08);
            text-decoration: none;
            color: #333;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .card:active {
            transform: scale(0.95);
        }
        .card-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 12px;
            font-weight: bold;
        }

        /* Modal / Popup Admin Panel */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content h3 {
            color: #cc0000;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
        }
        .modal-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-save { background: #28a745; color: white; }
        .btn-close { background: #6c757d; color: white; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>THE GLOBAL INDIAN SCHOOL</span>
        <button class="admin-btn-top" onclick="openAdminModal()">Admin Login</button>
    </div>

    <div class="banner-container">
        <div class="banner-card">
            <img src="https://via.placeholder.com/600x300.png?text=The+Global+Indian+School+Surat" alt="School Banner">
        </div>
    </div>

    <div class="notice-board" id="noticeBoardBox">
        <h4>📢 Principal Notice / Live Update:</h4>
        <p id="liveNoticeText">Welcome to The Global Indian School Surat! Check daily updates here.</p>
    </div>

    <div class="grid-container">
        <a href="#" class="card" style="background:#ffe6e6;"><div class="card-icon">📅</div><div class="card-title">Todays</div></a>
        <a href="#" class="card" style="background:#fff2e6;"><div class="card-icon">ℹ️</div><div class="card-title">About Us</div></a>
        <a href="#" class="card" style="background:#e6ffe6;"><div class="card-icon">👔</div><div class="card-title">Management</div></a>
        <a href="#" class="card" style="background:#e6f2ff;"><div class="card-icon">💬</div><div class="card-title">Principal</div></a>
        <a href="#" class="card" style="background:#ffe6f2;"><div class="card-icon">🎯</div><div class="card-title">Activity</div></a>
        <a href="#" class="card" style="background:#f2e6ff;"><div class="card-icon" onclick="openNoticeModal()">📋</div><div class="card-title">Notice</div></a>
        <a href="#" class="card" style="background:#e6fff2;"><div class="card-icon">🏫</div><div class="card-title">Facility</div></a>
        <a href="#" class="card" style="background:#ffffe6;"><div class="card-icon">🖼️</div><div class="card-title">Gallery</div></a>
        <a href="#" class="card" style="background:#f2f2ff;"><div class="card-icon">🎓</div><div class="card-title">Students</div></a>
        <a href="#" class="card" style="background:#ffe6f2;"><div class="card-icon">🎉</div><div class="card-title">Events</div></a>
        <a href="#" class="card" style="background:#fffae6;"><div class="card-icon">📝</div><div class="card-title">Inquiry</div></a>
        <a href="#" class="card" style="background:#e6fffa;"><div class="card-icon">📞</div><div class="card-title">Contact Us</div></a>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3>🔐 Principal Admin Panel</h3>
            <input type="password" id="adminPassInput" placeholder="Enter Password (Default: 1234)">
            <textarea id="adminNoticeInput" rows="3" placeholder="Type new notice or message here..."></textarea>
            <div class="modal-buttons">
                <button class="btn-save" onclick="saveNotice()">Publish Live</button>
                <button class="btn-close" onclick="closeAdminModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Load saved notice on start
        window.onload = function() {
            let saved = localStorage.getItem("schoolAppNotice");
            if(saved) {
                document.getElementById("liveNoticeText").innerText = saved;
            }
        }

        function openAdminModal() {
            document.getElementById("adminModal").style.display = "flex";
        }

        function closeAdminModal() {
            document.getElementById("adminModal").style.display = "none";
        }

        function saveNotice() {
            let pass = document.getElementById("adminPassInput").value;
            let text = document.getElementById("adminNoticeInput").value;

            if(pass === "1234") { // Aap password baad me change kar sakte hain
                if(text.trim() !== "") {
                    localStorage.setItem("schoolAppNotice", text);
                    document.getElementById("liveNoticeText").innerText = text;
                    document.getElementById("adminNoticeInput").value = "";
                    document.getElementById("adminPassInput").value = "";
                    closeAdminModal();
                    alert("Notice published live successfully!");
                } else {
                    alert("Please type a message first.");
                }
            } else {
                alert("Incorrect Password!");
            }
        }
    </script>
</body>
</html>
