
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Global Indian School</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f5f7;
      padding-bottom: 20px;
    }

    /* Top Red Bar */
    .top-bar {
      background: linear-gradient(90deg, #ff1a1a, #cc0000);
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Top Banner */
    .banner-container {
      padding: 15px;
    }
    .banner-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border: 3px solid #ffcc00;
      text-align: center;
    }
    .banner-card img {
      width: 100%;
      display: block;
    }

    /* Dashboard Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 15px;
    }

    /* Dashboard Cards with Different Light Colors */
    .card {
      border-radius: 15px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      text-decoration: none;
      color: #333;
    }

    .card-icon {
      background: white;
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }

    /* Light Theme Background Colors like Screenshot */
    .c1 { background-color: #ffe4e6; }
    .c2 { background-color: #ffedd5; }
    .c3 { background-color: #dcfce7; }
    .c4 { background-color: #e0f2fe; }
    .c5 { background-color: #fee2e2; }
    .c6 { background-color: #e0e7ff; }
    .c7 { background-color: #d1fae5; }
    .c8 { background-color: #fef3c7; }
    .c9 { background-color: #fae8ff; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="top-bar">
    <div>☰ THE GLOBAL INDIAN SCHOOL</div>
    <div>🔔 ⚙️</div>
  </div>

  <!-- Banner Container -->
  <div class="banner-container">
    <div class="banner-card">
      <!-- Aapki uploaded logo photo -->
      <img src="launchericon-512x512.png" alt="School Banner">
    </div>
  </div>

  <!-- Dashboard 3x3 Grid -->
  <div class="grid-container">

    <a href="#" class="card c1">
      <div class="card-icon">📅</div>
      <div class="card-title">Todays</div>
    </a>

    <a href="#" class="card c2">
      <div class="card-icon">👤</div>
      <div class="card-title">About Us</div>
    </a>

    <a href="#" class="card c3">
      <div class="card-icon">👔</div>
      <div class="card-title">Management Message</div>
    </a>

    <a href="#" class="card c4">
      <div class="card-icon">💬</div>
      <div class="card-title">Principal Message</div>
    </a>

    <a href="#" class="card c5">
      <div class="card-icon">🎯</div>
      <div class="card-title">Activity</div>
    </a>

    <a href="#" class="card c6">
      <div class="card-icon">📋</div>
      <div class="card-title">Notice</div>
    </a>

    <a href="#" class="card c7">
      <div class="card-icon">🏫</div>
      <div class="card-title">Facility</div>
    </a>

    <a href="#" class="card c8">
      <div class="card-icon">🖼️</div>
      <div class="card-title">Gallery</div>
    </a>

    <a href="#" class="card c9">
      <div class="card-icon">🎓</div>
      <div class="card-title">Student Zone</div>
    </a>

    <a href="#" class="card c1">
      <div class="card-icon">🎉</div>
      <div class="card-title">Events</div>
    </a>

    <a href="#" class="card c2">
      <div class="card-icon">📝</div>
      <div class="card-title">Admission Inquiry</div>
    </a>

    <a href="#" class="card c3">
      <div class="card-icon">📞</div>
      <div class="card-title">Contact Us</div>
    </a>

  </div>

</body>
</html>
